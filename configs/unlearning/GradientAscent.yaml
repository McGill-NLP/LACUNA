# From-scratch gradient-ascent unlearning. Implementation:
#   src/unlearn_methods/GradientAscent.py  (registered as method: gradient_ascent)
model: ${model}
data: ${unlearning_data}
paths: ${paths}
method: 'gradient_ascent'
# subdir under <base>/unlearned_models/<field>/ (matches precision_metrics.py --methods)
dir_name: 'GradientAscent'

# hyper-parameters read by GradientAscent.unlearn()
learning_rate: 1.0e-5
num_train_epochs: 4
batch_size: 4
max_length: 256
max_steps: null

# relearning experiments (src/relearn.py): recover forget knowledge from the
# memorized "relearn" split, then measure recovery + sentence-level leakage.
relearning:
  data_source: 'memorized'
  output_dir: ${paths.output_dir}/relearned
  training_args:
    output_dir: ${unlearning.relearning.output_dir}
    num_train_epochs: 10
    dataloader_num_workers: 4
    seed: ${seed}
    report_to: 'none'
    per_device_train_batch_size: 16
    per_device_eval_batch_size: 32
    gradient_accumulation_steps: 1
    max_grad_norm: 1.0
    remove_unused_columns: false
    save_strategy: 'steps'
    save_steps: 25
    save_total_limit: 1
    eval_strategy: 'steps'
    eval_steps: 25
    eval_on_start: true
    load_best_model_at_end: true
    metric_for_best_model: 'eval_loss'
    greater_is_better: false
    learning_rate: 1.0e-4
    weight_decay: 0.0
    warmup_ratio: 0.0
    lr_scheduler_type: 'constant'
    bf16: true
    logging_strategy: 'steps'
    logging_steps: 10
  lora:
    enable: false
