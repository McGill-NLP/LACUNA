defaults:
- trainer: SimNPO
- /collator@collator: DataCollatorForSupervisedDataset

data : ${unlearning_data}
model: ${model}
paths: ${paths}
method: 'open_unlearning'

trainer:
  args:
    learning_rate: 1e-4
    num_train_epochs: 200
    lr_scheduler_type: 'constant'

relearning:
  output_dir: ${paths.training_output_dir}/relearned_models/${unlearning_data.forget.Forget.name}/SimNPO
  training_args:
    output_dir: ${unlearning.relearning.output_dir}
    num_train_epochs: 10
    dataloader_num_workers: 10
    seed: ${seed}
    report_to: 'wandb'
    per_device_train_batch_size: 64
    per_device_eval_batch_size: 128
    gradient_accumulation_steps: 1
    max_grad_norm: 1.0
    remove_unused_columns: false
    save_strategy: 'steps'
    save_steps: 25
    save_total_limit: 1
    eval_strategy: 'steps'
    eval_steps: 25
    eval_on_start: true
    load_best_model_at_end: true
    metric_for_best_model: 'eval_loss'
    greater_is_better: false
    learning_rate: 1.5e-4
    weight_decay: 0.1
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_epsilon: 1e-8
    warmup_ratio: 0.1
    lr_scheduler_type: 'cosine'
    bf16: true
    fp16: false
    tf32: false
    logging_strategy: 'steps'
    logging_steps: 10
    logging_first_step: true
    ddp_find_unused_parameters: false
  lora:
    enable: true
    r: 16
    alpha: 8
    dropout: 0.1
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
    bias: "none"
    instruction_target: null
