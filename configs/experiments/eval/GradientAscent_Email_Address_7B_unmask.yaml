# @package _global_
# Unmask variant: unlearn the SAME field on the UNMASK-trained OLMo3-7B model, so
# scripts/precision_metrics.py can compute the contrast metrics (--unmask-base).
defaults:
  - override /paths: eval
  - override /model: LACUNA-OLMo3-7B
  - override /unlearned_model: LACUNA-Unlearned
  - override /unlearning_data: Email_Address_CrossField
  - override /unlearning: GradientAscent
  - override /eval: panorama
  - _self_

size: OLMo3-7B
regime: unmasked

task_name: eval_GradientAscent_Email_Address_7B_unmask
mode: unlearn

data: ${unlearning_data}
