# @package _global_
# End-to-end eval tutorial preset: unlearn Email_Address on the OLMo2-1B masked model
# with GradientAscent, then eval (forget/retain/utility), precision, relearn.
defaults:
  - override /paths: eval
  - override /model: LACUNA-OLMo2-1B
  - override /unlearned_model: LACUNA-Unlearned
  - override /unlearning_data: Email_Address_CrossField
  - override /unlearning: GradientAscent
  - override /eval: panorama
  - _self_

size: OLMo2-1B
regime: masked

task_name: eval_GradientAscent_Email_Address_1B
mode: unlearn

# panorama metrics read the top-level `data` mapping
data: ${unlearning_data}
