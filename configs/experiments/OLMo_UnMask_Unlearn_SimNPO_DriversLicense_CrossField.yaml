# @package _global_

defaults:
  - OLMo_UnMask_Train_FullSubset
  - _self_
  - override /model: OLMo2-1B-Pretrain
  - override /unlearned_model: OLMo2-1B-UnMask_Unlearned
  - override /unlearning_data: Drivers_License_CrossField
  - override /unlearning: SimNPO
  - override /eval: panorama

task_name: OLMo_UnMask_Unlearn_SimNPO
mode: unlearn

paths:
  output_dir: ${paths.training_output_dir}/unlearned_models/${unlearning_data.forget.Forget.name}/SimNPO

unlearning:
  eval_dashboard:
    enabled: true
    eval_on_start: true
    eval_on_end: true
    lm_eval:
      tasks: ["ai2_arc", "hellaswag", "mmlu"]
      interval: 150
      batch_size: 1000
      limit: 50
    panorama:
      interval: 150
