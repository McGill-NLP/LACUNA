[project]
name = "olmobench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10, <3.11"
dependencies = [
    "accelerate>=0.20.3",
    "av>=16.1.0",
    "bitsandbytes>=0.44.1",
    "datasets>=2.13.2",
    "deepspeed>=0.18.6",
    "easyeditor",
    "einops>=0.6.1",
    "evaluate>=0.4.6",
    "fairscale>=0.4.6",
    "flash-attn>=2.8.3",
    "gpustat>=1.1.1",
    "higher>=0.2.1",
    "huggingface-hub>=1.4.1",
    "hydra-colorlog>=1.2.0",
    "hydra-core>=1.3.2",
    "importlib-metadata>=6.7.0",
    "iopath>=0.1.10",
    "ipykernel>=6.16.2",
    "ipywidgets>=8.1.8",
    "llm-unlearn",
    "lm-eval>=0.4.11",
    "matplotlib>=3.5.3",
    "nltk>=3.8.1",
    "nnsight>=0.6.3",
    "numpy>=1.21.6",
    "omegaconf>=2.3.0",
    "open-unlearning",
    "openai>=0.8.0",
    "opencv-python>=4.11.0.86",
    "pandas>=1.1.5",
    "peft>=0.3.0",
    "pyarrow>=12.0.1",
    "pyyaml>=6.0.1",
    "qwen-vl-utils>=0.0.14",
    "rouge>=1.0.1",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.0.2",
    "scipy>=1.7.3",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.2.2",
    "sentencepiece>=0.2.0",
    "tensorboard>=2.11.2",
    "timm>=0.9.12",
    "torch==2.9",
    "tqdm>=4.67.3",
    "transformers>=5.1.0",
    "wandb>=0.25.0",
    "zhipuai>=2.1.2",
]

[tool.uv.workspace]
members = [
    "open-unlearning",
    "KnowUnDo",
    "EasyEdit",
]

[tool.uv.sources]
open-unlearning = { workspace = true, editable = true }
llm-unlearn = { workspace = true, editable = true }
easyeditor = { workspace = true, editable = true }
torch = { url = "https://download.pytorch.org/whl/cu126/torch-2.9.0%2Bcu126-cp310-cp310-manylinux_2_28_x86_64.whl"} 
flash-attn = { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.7.16/flash_attn-2.8.3%2Bcu126torch2.9-cp310-cp310-linux_x86_64.whl"}

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

