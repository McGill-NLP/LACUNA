[project]
name = "lacuna"
version = "0.1.0"
description = "LACUNA: a testbed for evaluating localization precision for LLM unlearning (evaluation release)"
readme = "README.md"
requires-python = ">=3.10, <3.11"
dependencies = [
    "accelerate>=0.20.3",
    "bitsandbytes>=0.44.1",
    "datasets>=2.13.2",
    "deepspeed>=0.18.6",
    "einops>=0.6.1",
    "evaluate>=0.4.6",
    "flash-attn>=2.8.3",
    "huggingface-hub>=1.4.1",
    "hydra-colorlog>=1.2.0",
    "hydra-core>=1.3.2",
    "ipykernel>=6.16.2",
    "lm-eval>=0.4.11",
    "matplotlib>=3.5.3",
    "nltk>=3.8.1",
    "numpy>=1.21.6",
    "omegaconf>=2.3.0",
    "open-unlearning",
    "pandas>=1.1.5",
    "peft>=0.3.0",
    "pyarrow>=12.0.1",
    "pyyaml>=6.0.1",
    "rouge>=1.0.1",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.0.2",
    "scipy>=1.7.3",
    "sentence-transformers>=5.2.2",
    "sentencepiece>=0.2.0",
    "torch==2.9",
    "tqdm>=4.67.3",
    "transformers>=5.1.0",
    "wandb>=0.25.0",
]

[tool.uv.workspace]
members = [
    "open-unlearning",
]

[tool.uv.sources]
open-unlearning = { workspace = true, editable = true }
torch = { url = "https://download.pytorch.org/whl/cu126/torch-2.9.0%2Bcu126-cp310-cp310-manylinux_2_28_x86_64.whl" }
flash-attn = { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.7.16/flash_attn-2.8.3%2Bcu126torch2.9-cp310-cp310-linux_x86_64.whl" }

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]
